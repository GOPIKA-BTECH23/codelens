# Local development stack: `docker compose up --build`
#   web  -> http://localhost:5173   (Vite dev server, proxies /api to the api service)
#   api  -> http://localhost:8000   (FastAPI, docs at /docs)
#   worker  -> no port; claims jobs from Postgres (`docker compose logs -f worker`)
#   db   -> localhost:${POSTGRES_PORT:-5432} (Postgres + pgvector)
# Values below are DEV-ONLY defaults; override them in a root .env (gitignored) if you like.

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codelens}:${POSTGRES_PASSWORD:-codelens}@postgres:5432/${POSTGRES_DB:-codelens}
  WEB_ORIGIN: http://localhost:5173
  API_ORIGIN: http://localhost:8000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: development
  # Secrets come from the root .env (never hard-code them here). `:?` makes compose stop
  # with this message instead of starting an API that would crash at boot.
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
  JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
  JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
  GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?set GITHUB_OAUTH_CLIENT_ID in .env}
  GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?set GITHUB_OAUTH_CLIENT_SECRET in .env}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env (openssl rand -hex 32)}
  # Required by the worker from M5 (it posts reviews as the App). Inside the container a host
  # file path does not exist, so use the base64 form here (see .env.example).
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  WEBHOOK_IGNORED_PR_AUTHORS: ${WEBHOOK_IGNORED_PR_AUTHORS:-dependabot[bot],renovate[bot]}
  # LLM (M5). The worker checks at startup that the chosen provider's key is set.
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  LLM_MODEL: ${LLM_MODEL:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-20}
  # Review policy (M5); see .env.example.
  REVIEW_CONFIDENCE_THRESHOLD: ${REVIEW_CONFIDENCE_THRESHOLD:-0.6}
  REVIEW_MAX_COMMENTS: ${REVIEW_MAX_COMMENTS:-15}
  REVIEW_IGNORE_PATTERNS: ${REVIEW_IGNORE_PATTERNS:-}
  REVIEW_NO_CODE_BEHAVIOR: ${REVIEW_NO_CODE_BEHAVIOR:-skip}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelens}
      POSTGRES_DB: ${POSTGRES_DB:-codelens}
    ports:
      - '${POSTGRES_PORT:-5432}:5432' # set POSTGRES_PORT if 5432 is taken on your machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro # creates codelens_test on first start
    healthcheck:
      # Marks the container "healthy" only when Postgres accepts connections.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      <<: *api-env
      # The job loop runs in the separate `worker` service below. Set true (and drop that
      # service) to mimic the free-tier mode where the API process runs the worker itself.
      RUN_WORKER_IN_API: 'false'
    ports:
      - '8000:8000'
    volumes:
      - ./apps/api:/app # live code reload
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    # Same image and code as the api, different command. No published port, no healthcheck, and
    # no --reload: restart it after changing worker code (`docker compose restart worker`).
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    command: ['python', '-m', 'app.worker.main']
    environment:
      <<: *api-env
      RUN_WORKER_IN_API: 'false'
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DAILY_COST_CAP_USD: ${DAILY_COST_CAP_USD:-5}
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s # longer than WORKER_SHUTDOWN_GRACE_SECONDS (20), so SIGTERM can drain
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: 'true' # file events do not cross the Windows bind mount
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/app # live code reload
      - /app/node_modules # keep the Linux node_modules from the image, not the host's
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
