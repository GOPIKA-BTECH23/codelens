# Alembic configuration. The database URL is NOT here: migrations/env.py takes it from
# Settings (DATABASE_URL) so there is one source of truth and no password in a tracked file.

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
