[project]
name = "codelens-api"
dynamic = ["version"]
description = "CodeLens API: webhook intake, REST, SSE chat and background worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pgvector==0.5.1",
    "pyjwt[crypto]==2.15.1",  # HS256 session tokens (M2) and RS256 GitHub App JWTs (M3)
    "cryptography==50.0.2",  # loads the GitHub App private key (also the RS256 backend)
    "httpx==0.28.1",  # outbound GitHub calls (respx mocks this client in tests)
    "google-genai==2.31.0",
    "groq==1.7.0",
    "sentry-sdk[fastapi]==2.72.0"  # optional error reporting (M7),
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",  # used by Starlette/FastAPI TestClient (replaces httpx there)
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.4.0",
    "ruff==0.17.1",
    "respx==0.23.1",  # mocks GitHub for httpx
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
src = [".", "../.."]  # `evals` (the M13 harness, at the repo root) is first-party too
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
files = ["app/core", "app/services", "app/worker", "app/ai", "app/deps.py", "../../evals"]
# CLAUDE.md decision 22: strict on core/, services/ and ai/ (ai/ joined in M5, the evals/ harness in M13). Each directory is added to
# `files` (and to the CI step) in the milestone that fills it.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import the eval harness (evals/, M13) next to `app`.
pythonpath = ["../.."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
